preprocessing_cmd: "python3 data/scripts/download_reactome.py -- streams Ensembl2Reactome.txt (tab-separated: ensembl_gene_id, reactome_pathway_id, url, pathway_name, evidence_code, species), filters to species=='Homo sapiens', caps membership rows at 20000 in on-disk file order (raw multi-species download not retained -- ~183MB, exceeds the per-source disk budget); writes curies.txt + labels.jsonl for every REACT pathway touched by the kept rows, plus pathway_membership.jsonl (gene, pathway) for the kept rows themselves."
